<!DOCTYPE html>

<html>
<head>


<title>GET YOUR TASKS DONE!!</title>
<style>
    h1 {font-family: "garamond"; color: hotpink; font-size: 90px; text-align: center; background-color: rgba(0, 0, 0, 0.5); border-color: pink; border-inline: 5px;}
    body{background-color: black; background-image:url('starbg.jpeg'); }
    h2{ font-family:"garamond"; color:lightpink; font-size:60px; text-align: left; border-color: pink;background-color: rgba(0, 0, 0, 0.5); }
    h3{ font-family: "garamond";  color: hotpink; font-size: 50px; text-align: center; background-color: rgba(0, 0, 0, 0.5); }
    button{ width:150px; height: 70px; color:hotpink; background-color: black; font-size: 25px; font-family: "garamond";}
    h6{ color:black; background-color:white; }
</style>

<script>

    // Start XP from saved value, or 0
    var totalXP = Number(localStorage.getItem("xp")) || 0;


    function xp(checkbox) {

        if (checkbox.checked) {
            totalXP = totalXP + 5;
        }

        else {
            totalXP = totalXP - 5;
        }

        // Update XP on screen
        document.getElementById("xpdisplay").innerHTML = totalXP;

        // Save XP
        localStorage.setItem("xp", totalXP);

        // Save checkbox state
        localStorage.setItem(checkbox.id, checkbox.checked);

        levelup();
    }


    function saveTask(task) {

        // Save whatever the user typed
        localStorage.setItem(task.id, task.value);

    }


    function loadData() {

        // Show saved XP
        document.getElementById("xpdisplay").innerHTML = totalXP;


        // Array containing all checkbox IDs
        var checkboxes = ["c1", "c2", "c3", "c4", "c5"];


        // Load checkbox states
        for (var i = 0; i < checkboxes.length; i++) {

            var savedValue = localStorage.getItem(checkboxes[i]);

            if (savedValue == "true") {

                document.getElementById(checkboxes[i]).checked = true;

            }

        }


        // Array containing all task IDs
        var tasks = ["t1", "t2", "t3", "t4", "t5"];


        // Load task names
        for (var i = 0; i < tasks.length; i++) {

            var savedTask = localStorage.getItem(tasks[i]);

            if (savedTask != null) {

                document.getElementById(tasks[i]).value = savedTask;

            }

        }

    }
    function levelup() 
    {
        if (totalXP==  25) {
            alert("You have reached the next level🥂")
        }
    }
   var time = 25 * 60;
var timer;

function startTimer() {

    timer = setInterval(function() {

        time--;

        var minutes = Math.floor(time / 60);
        var seconds = time % 60;

        if (seconds < 10) {
            seconds = "0" + seconds;
        }

        document.getElementById("timer").innerHTML =
            minutes + ":" + seconds;

        if (time <= 0) {

            clearInterval(timer);

            alert("Session Completed! Take a small break now☕");

        }

    }, 1000);

}

</script>


</head>

<body onload="loadData()">


<h1>TASKS</h1>
<h2>
    Total XP: <span id="xpdisplay">0</span>
</h2>


<center><table border="3" bgcolor="aliceblue" style="width:600px; height: 400px;">

    <tr>
        <th>Task</th>
        <th>Completed?</th>
    </tr>


    <tr>

        <td>
            <input type="text"
                   id="t1"
                   oninput="saveTask(this)">
        </td>

        <td>
            <input type="checkbox"
                   id="c1"
                   onclick="xp(this)">
        </td>

    </tr>


    <tr>

        <td>
            <input type="text"
                   id="t2"
                   oninput="saveTask(this)">
        </td>

        <td>
            <input type="checkbox"
                   id="c2"
                   onclick="xp(this)">
        </td>

    </tr>


    <tr>

        <td>
            <input type="text"
                   id="t3"
                   oninput="saveTask(this)">
        </td>

        <td>
            <input type="checkbox"
                   id="c3"
                   onclick="xp(this)">
        </td>

    </tr>


    <tr>

        <td>
            <input type="text"
                   id="t4"
                   oninput="saveTask(this)">
        </td>

        <td>
            <input type="checkbox"
                   id="c4"
                   onclick="xp(this)">
        </td>

    </tr>


    <tr>

        <td>
            <input type="text"
                   id="t5"
                   oninput="saveTask(this)">
        </td>

        <td>
            <input type="checkbox"
                   id="c5"
                   onclick="xp(this)">
        </td>

    </tr>

</table></center>
<hr><hr>
<h2>Pomodoro Timer🍅</h2>
<h3 id="timer">25:00</h3>
<center><button onclick="startTimer()">Start Sesssion</button></center>
<hr>
<hr>
<h6>created by sai🫶</h6>



</body>
</html>
